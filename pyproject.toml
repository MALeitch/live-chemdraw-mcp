[project]
name = "live-chemdraw-mcp"
version = "1.0.0"
description = "MCP server connecting AI assistants to a live ChemDraw window via COM automation"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pywin32>=310",
    "rdkit>=2024.3",
    "mcp[cli]>=1.2,<2.0",
    "olefile>=0.47",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tools"]
filterwarnings = [
    "ignore::DeprecationWarning",
]