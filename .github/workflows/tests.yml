name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # pywin32 (a hard dependency) is Windows-only, so this must run on a
    # Windows runner even though the test suite itself is pure Python with
    # no live ChemDraw connection (test_bridge.py, the live smoke script,
    # is intentionally excluded — see pyproject.toml's testpaths).
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run tests
        # python -m pytest (not bare `pytest`): -m inserts the CWD (repo
        # root) onto sys.path, which is what makes `tools/` importable --
        # `pip install -e .` only wires up chemdraw_connector as a
        # package, and tests/ has no __init__.py so pytest's own rootdir
        # insertion doesn't reach the repo root on its own. Confirmed this
        # matters: bare `pytest tests/ -q` fails CI with
        # "ModuleNotFoundError: No module named 'tools'" even though the
        # identical command passes locally via `python -m pytest`.
        run: python -m pytest tests/ -q
