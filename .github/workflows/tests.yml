# live-chemdraw-mcp CI Configuration
# Place in .github/workflows/tests.yml

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/Scripts/pip install -e ".[dev]"
      - name: Run unit tests
        run: |
          .venv/Scripts/pytest tests/ -v --tb=short -x

